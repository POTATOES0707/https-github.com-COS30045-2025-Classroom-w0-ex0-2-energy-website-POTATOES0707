<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>D3 House Scene</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      margin: 0;
    }
  </style>
</head>
<body>
  <script>
    const width = 600;
    const height = 600;

    const svg = d3.select("body")
      .append("svg")
      .attr("width", width)
      .attr("height", height);

    // Sky
    svg.append("rect")
      .attr("width", width)
      .attr("height", height)
      .attr("fill", "skyblue");

    // Ground
    svg.append("rect")
      .attr("y", height / 2)
      .attr("width", width)
      .attr("height", height / 2)
      .attr("fill", "green");

    // House body
    svg.append("rect")
      .attr("x", 200)
      .attr("y", 250)
      .attr("width", 200)
      .attr("height", 200)
      .attr("fill", "saddlebrown");

    // Roof (triangle)
    svg.append("polygon")
      .attr("points", "200,250 400,250 300,150")
      .attr("fill", "peru");

    // Windows
    svg.append("rect")
      .attr("x", 220)
      .attr("y", 270)
      .attr("width", 50)
      .attr("height", 50)
      .attr("fill", "lightblue");

    svg.append("rect")
      .attr("x", 330)
      .attr("y", 270)
      .attr("width", 50)
      .attr("height", 50)
      .attr("fill", "lightblue");

    // Door
    svg.append("rect")
      .attr("x", 275)
      .attr("y", 350)
      .attr("width", 50)
      .attr("height", 100)
      .attr("fill", "brown");

    // Door knob
    svg.append("circle")
      .attr("cx", 315)
      .attr("cy", 400)
      .attr("r", 5)
      .attr("fill", "black");

    // Tree trunk
    svg.append("rect")
      .attr("x", 120)
      .attr("y", 300)
      .attr("width", 20)
      .attr("height", 100)
      .attr("fill", "sienna");

    // Tree foliage
    svg.append("circle")
      .attr("cx", 130)
      .attr("cy", 280)
      .attr("r", 25)
      .attr("fill", "forestgreen");

    svg.append("circle")
      .attr("cx", 150)
      .attr("cy", 280)
      .attr("r", 25)
      .attr("fill", "forestgreen");

      svg.append("circle")
      .attr("cx", 140)
      .attr("cy", 250)
      .attr("r", 25)
      .attr("fill", "forestgreen");

    // Sun
    svg.append("circle")
      .attr("cx", 500)
      .attr("cy", 100)
      .attr("r", 40)
      .attr("fill", "yellow");

    // House label
    svg.append("text")
      .attr("x", 410)
      .attr("y", 370)
      .attr("font-size", "20px")
      .attr("fill", "black")
      .text("House");
  </script>
</body>
</html>
